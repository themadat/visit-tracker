name: Deploy to GitHub Pages

# Production:  main branch       -> https://themadat.github.io/visit-tracker/
# Beta:        3-0-0-Trail-Log   -> https://themadat.github.io/visit-tracker/beta/
#
# Each branch publishes into its own subfolder of the gh-pages branch.
# keep_files: true prevents one branch's deploy from wiping the other's folder.

on:
  push:
    branches:
      - main
      - 3-0-0-Trail-Log
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Decide destination subfolder
        id: dest
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "label=production" >> "$GITHUB_OUTPUT"
          else
            echo "dir=beta" >> "$GITHUB_OUTPUT"
            echo "label=beta (${{ github.ref_name }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark deploy with .nojekyll
        run: touch .nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          exclude_assets: '.github,build,context,.claude'
          commit_message: "Deploy ${{ steps.dest.outputs.label }} from ${{ github.sha }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
