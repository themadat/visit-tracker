<!-- Optional install-icon picker. Add this inside a settings/help/install dialog. -->
<section class="install-icon-picker" data-app-icon-picker>
  <h3>App Icon</h3>
  <fieldset class="install-icon-options">
    <legend class="sr-only">Choose app icon</legend>

    <label class="install-icon-option">
      <input type="radio" name="appIconVariant" value="light" data-app-icon-variant>
      <span class="install-icon-thumb install-icon-thumb-light" style="--install-icon-thumb: url('icon/app-icon-light.svg')" aria-hidden="true"></span>
      <span class="install-icon-copy">
        <span class="install-icon-label">Light</span>
        <span class="install-icon-caption">Use the light home-screen and favicon set.</span>
      </span>
    </label>

    <label class="install-icon-option">
      <input type="radio" name="appIconVariant" value="dark" data-app-icon-variant>
      <span class="install-icon-thumb install-icon-thumb-dark" style="--install-icon-thumb: url('icon/app-icon-dark.svg')" aria-hidden="true"></span>
      <span class="install-icon-copy">
        <span class="install-icon-label">Dark</span>
        <span class="install-icon-caption">Use the dark home-screen and favicon set.</span>
      </span>
    </label>
  </fieldset>

  <p class="install-icon-reload" data-app-icon-reload-notice hidden>
    Changed the icon? Reload before using Safari Add to Dock.
    <button type="button" data-app-icon-reload>Reload</button>
  </p>
</section>
