<!-- App icon and favicon links. Put this near the top of <head>. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // Add apple-touch-icon, manifest, and PNG favicons before they are fetched.
  // This helps Safari Add to Dock and Chromium install flows pick the chosen
  // light/dark icon variant consistently.
  (function () {
    var storageKey = "appInstallIconVariant";
    var variant = "light";
    try {
      if (localStorage.getItem(storageKey) === "dark") variant = "dark";
    } catch (err) { }

    var isDark = variant === "dark";
    var basePath = "";

    function asset(name) {
      return basePath ? basePath.replace(/\/?$/, "/") + name : name;
    }

    function add(rel, href, attrs) {
      var link = document.createElement("link");
      link.rel = rel;
      link.href = asset(href);
      for (var key in attrs || {}) link.setAttribute(key, attrs[key]);
      document.head.appendChild(link);
    }

    add("apple-touch-icon", isDark ? "apple-touch-icon-dark.png" : "apple-touch-icon.png");
    add("manifest", isDark ? "manifest-dark.webmanifest" : "manifest.webmanifest");
    add("icon", isDark ? "favicon-32-dark.png" : "favicon-32.png", { sizes: "32x32", type: "image/png" });
    add("icon", isDark ? "favicon-16-dark.png" : "favicon-16.png", { sizes: "16x16", type: "image/png" });
  })();
</script>
<meta name="apple-mobile-web-app-title" content="App Name">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<meta name="description" content="App Name description.">
